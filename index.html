<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trinquet 3D — Shot Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0c12; overflow: hidden; }
  #container { position: fixed; inset: 0; }

  #panel {
    position: fixed; top: 12px; right: 12px; width: 300px;
    display: flex; flex-direction: column; gap: 6px;
    max-height: calc(100vh - 24px); overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: #333 transparent;
    z-index: 10;
  }
  .shot-btn {
    display: flex; flex-direction: column; padding: 10px 14px;
    border: 1px solid #2a2d38; border-radius: 8px; background: #12141cdd;
    cursor: pointer; transition: all .15s; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .shot-btn:hover { background: #1a1e2add; border-color: #3a3f52; }
  .shot-btn.active { border-color: var(--c); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 25%, transparent); }
  .shot-btn .name { font-weight: 600; font-size: .88rem; color: #eee; }
  .shot-btn .es { color: #888; font-weight: 400; font-size: .78rem; }
  .shot-btn .desc { font-size: .72rem; color: #999; line-height: 1.35; margin-top: 3px; }

  #cameras {
    position: fixed; top: 12px; left: 12px; display: flex; gap: 6px;
    flex-wrap: wrap; max-width: 440px; z-index: 10;
  }
  #cameras button {
    padding: 6px 12px; border: 1px solid #2a2d38; border-radius: 6px;
    background: #12141cdd; color: #bbb; cursor: pointer; font-size: .75rem;
    transition: all .15s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #cameras button:hover { background: #1e2230dd; color: #fff; }
  #cameras button.active { border-color: #4a7cff; color: #4a7cff; }
  #langBtn { border-color: #885588 !important; color: #cc88cc !important; font-weight: 600; }
  #langBtn:hover { color: #eeb0ee !important; }

  #controls {
    position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px;
    align-items: center; z-index: 10;
  }
  #controls button {
    padding: 7px 16px; border: 1px solid #2a2d38; border-radius: 6px;
    background: #12141cdd; color: #ccc; cursor: pointer; font-size: .78rem;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all .15s;
  }
  #controls button:hover { background: #1e2230dd; color: #fff; }
  #dimBtn.active { border-color: #ccaa00; color: #ccaa00; }
  #editToggle.active { border-color: #7ec8ff; color: #7ec8ff; }

  #editor {
    position: fixed; right: 12px; bottom: 12px; width: 300px;
    border: 1px solid #2a2d38; border-radius: 8px; background: #12141cdd;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px; z-index: 10; display: none;
  }
  #editor.visible { display: block; }
  #editor .row { display: flex; gap: 6px; margin-top: 6px; }
  #editor .row label { flex: 1; font-size: .68rem; color: #95a0b6; display: flex; flex-direction: column; gap: 3px; }
  #editor .title { color: #ccd5e5; font-size: .78rem; font-weight: 600; }
  #editor input {
    width: 100%; background: #0e1118; color: #d8deeb; border: 1px solid #2a2d38;
    border-radius: 5px; padding: 4px 6px; font-size: .72rem;
  }
  #editor .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  #editor button {
    padding: 6px 8px; border: 1px solid #2a2d38; border-radius: 6px;
    background: #12141cdd; color: #c9d0dd; cursor: pointer; font-size: .72rem;
  }
  #editor button:hover { background: #1e2230dd; color: #fff; }

  #legend {
    position: fixed; bottom: 52px; left: 12px; padding: 10px 14px;
    border: 1px solid #2a2d38; border-radius: 8px; background: #12141cdd;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: .7rem; color: #888; line-height: 1.7; z-index: 10;
  }
  #legend b { color: #bbb; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; margin-right: 4px; }

  #title {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #ffffff50; font-size: .7rem; z-index: 10; text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="container"></div>

<div id="cameras">
  <button data-cam="default" class="active" data-i18n="camDefault">3/4 View</button>
  <button data-cam="top" data-i18n="camTop">Top</button>
  <button data-cam="side" data-i18n="camSide">Side (Glass)</button>
  <button data-cam="player" data-i18n="camPlayer">Player POV</button>
  <button data-cam="frontis" data-i18n="camFrontis">From Frontis</button>
  <button data-cam="gallery" data-i18n="camGallery">Gallery (Tejadillo)</button>
  <button id="langBtn">FR</button>
</div>

<div id="panel"></div>

<div id="controls">
  <button id="replay" data-i18n="replay">&#x25B6; Replay</button>
  <button id="speed">Speed: 1x</button>
  <button id="pause" data-i18n="pause">Pause</button>
  <button id="dimBtn" data-i18n="dimensions">Dimensions</button>
  <button id="editToggle">Edit shot</button>
</div>

<div id="legend"></div>
<div id="editor">
  <div class="title">Shot editor</div>
  <div class="row">
    <label>pos.x <input id="ed_pos_x" type="number" step="0.1"></label>
    <label>pos.y <input id="ed_pos_y" type="number" step="0.1"></label>
    <label>pos.z <input id="ed_pos_z" type="number" step="0.1"></label>
  </div>
  <div class="row">
    <label>dir.x <input id="ed_dir_x" type="number" step="0.01"></label>
    <label>dir.y <input id="ed_dir_y" type="number" step="0.01"></label>
    <label>dir.z <input id="ed_dir_z" type="number" step="0.01"></label>
  </div>
  <div class="row">
    <label>strength <input id="ed_strength" type="number" step="0.1"></label>
  </div>
  <div class="btns">
    <label style="display:flex;align-items:center;gap:6px;color:#aeb8cc;font-size:.72rem;padding-right:8px;">
      <input id="ed_live" type="checkbox" checked style="width:auto;">
      Live apply
    </label>
    <button id="ed_apply">Apply</button>
    <button id="ed_export">Export JSON</button>
    <button id="ed_import_btn">Import JSON</button>
    <input id="ed_import_file" type="file" accept="application/json" style="display:none">
  </div>
</div>

<div id="title" data-i18n="subtitle">Drag to orbit &middot; Scroll to zoom &middot; Right-click to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── i18n ──
const i18n = {
  en: {
    pageTitle: 'Trinquet 3D — Shot Simulator',
    subtitle: 'Drag to orbit \u00b7 Scroll to zoom \u00b7 Right-click to pan',
    replay: '\u25b6 Replay', pause: 'Pause', resume: 'Resume',
    speedLabel: 'Speed', dimensions: 'Dimensions',
    camDefault: '3/4 View', camTop: 'Top', camSide: 'Side (Glass)',
    camPlayer: 'Player POV', camFrontis: 'From Frontis', camGallery: 'Gallery (Tejadillo)',
    legendTitle: 'Court elements',
    legFrontis: 'Frontis (front wall)', legRebote: 'Rebote (back wall)',
    legFraile: 'Fraile \u2014 45\u00b0 wedge (right)', legTejadillo: 'Tejadillo \u2014 inclined roof (left)',
    legChapa: 'Chapa \u2014 metal strips', legSare: 'Sare \u2014 net window',
    legOreilles: 'Oreilles \u2014 side wall fault zones (above 5.5m)',
    lbl_frontis: 'FRONTIS', lbl_rebote: 'REBOTE', lbl_fraile: 'FRAILE',
    lbl_tejadillo: 'TEJADILLO', lbl_sare: 'SARE', lbl_leftWall: 'LEFT WALL',
    lbl_oreille: 'OREILLE',
    shot_saque_name: 'Serve', shot_saque_sub: 'Saque',
    shot_saque_desc: 'From 22m, hard throw to the frontis. A good serve stays arrimada (tight) to the left wall (tejadillo side), making the return very difficult.',
    shot_dejada_name: 'Drop shot', shot_dejada_sub: 'Dejada de abajo',
    shot_dejada_desc: 'Deceptive soft touch just above the chapa (80cm metal strip). The ball barely bounces and dies near the frontis \u2014 unreturnable.',
    shot_dosparedes_name: 'Two walls', shot_dosparedes_sub: 'Dos paredes',
    shot_dosparedes_desc: 'Hits the left wall (tejadillo side) first, then the frontis. The ball opens wide toward the right (glass) wall \u2014 very hard to read.',
    shot_arrimada_name: 'Wall hugger', shot_arrimada_sub: 'Arrimada',
    shot_arrimada_desc: 'Trajectory parallel and very close to the left wall (tejadillo) for its entire path. Extremely difficult to return \u2014 the wall blocks the swing.',
    shot_fraile_name: 'Fraile / Tambor', shot_fraile_sub: 'Golpe al fraile',
    shot_fraile_desc: 'Targets the 45\u00b0 wedge between frontis and right wall (glass side). The ball deflects at an unpredictable angle \u2014 a signature trinquet shot.',
    shot_tejadillo_name: 'Roof shot', shot_tejadillo_sub: 'Tejadillo',
    shot_tejadillo_desc: "Lofted onto the inclined roof on the left side. The ball rolls unpredictably on the wooden slope before dropping off \u2014 roof bounces don't count.",
    shot_gancho_name: 'Hook', shot_gancho_sub: 'Gancho',
    shot_gancho_desc: 'A volley caught in the air and sent sharply toward the fraile (right) corner with a hooking arm motion. Fast and disorienting.',
  },
  fr: {
    pageTitle: 'Trinquet 3D \u2014 Simulateur de coups',
    subtitle: 'Glisser pour orbiter \u00b7 Molette pour zoomer \u00b7 Clic droit pour d\u00e9placer',
    replay: '\u25b6 Rejouer', pause: 'Pause', resume: 'Reprendre',
    speedLabel: 'Vitesse', dimensions: 'Dimensions',
    camDefault: 'Vue 3/4', camTop: 'Dessus', camSide: 'C\u00f4t\u00e9 (Vitre)',
    camPlayer: 'Vue joueur', camFrontis: 'Depuis le frontis', camGallery: 'Galerie (Tejadillo)',
    legendTitle: '\u00c9l\u00e9ments du trinquet',
    legFrontis: 'Frontis (mur avant)', legRebote: 'Rebote (mur du fond)',
    legFraile: 'Fraile \u2014 coin 45\u00b0 (droite)', legTejadillo: 'Tejadillo \u2014 toit inclin\u00e9 (gauche)',
    legChapa: 'Chapa \u2014 bandes m\u00e9talliques', legSare: 'Sare \u2014 filet',
    legOreilles: 'Oreilles \u2014 zones de faute murales (au-dessus de 5,5m)',
    lbl_frontis: 'FRONTIS', lbl_rebote: 'REBOTE', lbl_fraile: 'FRAILE',
    lbl_tejadillo: 'TEJADILLO', lbl_sare: 'SARE', lbl_leftWall: 'MUR GAUCHE',
    lbl_oreille: 'OREILLE',
    shot_saque_name: 'Service', shot_saque_sub: 'Saque',
    shot_saque_desc: 'Depuis 22m, frappe puissante vers le frontis. Un bon service reste arrimada (coll\u00e9) au mur gauche (c\u00f4t\u00e9 tejadillo), rendant le retour tr\u00e8s difficile.',
    shot_dejada_name: 'Amorti', shot_dejada_sub: 'Dejada de abajo',
    shot_dejada_desc: 'Toucher d\u00e9licat juste au-dessus de la chapa (bande m\u00e9tallique \u00e0 80cm). La balle rebondit \u00e0 peine et meurt pr\u00e8s du frontis \u2014 imparable.',
    shot_dosparedes_name: 'Deux murs', shot_dosparedes_sub: 'Dos paredes',
    shot_dosparedes_desc: "Frappe d'abord le mur gauche (c\u00f4t\u00e9 tejadillo), puis le frontis. La balle s'ouvre largement vers le mur droit (vitre) \u2014 trajectoire tr\u00e8s difficile \u00e0 lire.",
    shot_arrimada_name: 'Coll\u00e9e', shot_arrimada_sub: 'Arrimada',
    shot_arrimada_desc: "Trajectoire parall\u00e8le et tr\u00e8s proche du mur gauche (tejadillo) sur toute la longueur. Extr\u00eamement difficile \u00e0 retourner \u2014 le mur bloque le mouvement.",
    shot_fraile_name: 'Fraile / Tambor', shot_fraile_sub: 'Golpe al fraile',
    shot_fraile_desc: "Vise le coin inclin\u00e9 \u00e0 45\u00b0 entre le frontis et le mur droit (c\u00f4t\u00e9 vitre). La balle d\u00e9vie de fa\u00e7on impr\u00e9visible \u2014 un coup signature du trinquet.",
    shot_tejadillo_name: 'Coup au tejadillo', shot_tejadillo_sub: 'Tejadillo',
    shot_tejadillo_desc: "Lob envoy\u00e9 sur le toit inclin\u00e9 c\u00f4t\u00e9 gauche. La balle roule de fa\u00e7on impr\u00e9visible sur la pente en bois avant de retomber \u2014 les rebonds sur le toit ne comptent pas.",
    shot_gancho_name: 'Crochet', shot_gancho_sub: 'Gancho',
    shot_gancho_desc: "Vol\u00e9e prise en l'air et envoy\u00e9e s\u00e8chement vers le coin du fraile (droite) avec un mouvement de crochet. Rapide et d\u00e9sorientant.",
  },
};

let lang = 'en';
function t(key) { return i18n[lang][key] || i18n.en[key] || key; }

// ── Court dimensions (meters) ──
const COURT_L = 28.5, COURT_W = 9.3, COURT_H = 9.5;
const FRAILE_W = 0.47;
const TEJ_D = 1.3, TEJ_H_OUTER = 1.9, TEJ_H_INNER = 2.25;
const CHAPA_LOW = 0.8, CHAPA_HIGH = 8.5, CHAPA_REBOTE = 5.0;
const WALL_STEP_X = 4.5, WALL_H_FRONT = 8.5, WALL_H_BACK = 5.5;
const TEJ_Z = COURT_W - TEJ_D;
const FRONTIS_H = 10;
const W = COURT_W;
const NET_START = 4.5;
const NET_END = 25.2;
const POLE_X = [4.5, 7.25, 10.0, 12.5, 15.0, 17.5, 20.0, 22.6, 25.2];

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
scene.fog = new THREE.FogExp2(0x0a0c12, 0.008);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById('container').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(30, 13, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(10, 2, 5);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// ── Lights ──
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xfff8e8, 1.2);
dirLight.position.set(14, 20, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
Object.assign(dirLight.shadow.camera, { left: -20, right: 35, top: 15, bottom: -5, near: 1, far: 50 });
scene.add(dirLight);
scene.add(new THREE.DirectionalLight(0xb0c0ff, 0.3).translateX(-5).translateY(10).translateZ(10));

// ── Materials ──
const mat = {
  floor:    new THREE.MeshStandardMaterial({ color: 0x1a3828, roughness: 0.85 }),
  frontis:  new THREE.MeshStandardMaterial({ color: 0xb8a898, roughness: 0.6 }),
  rebote:   new THREE.MeshStandardMaterial({ color: 0xa09080, roughness: 0.6 }),
  wall:     new THREE.MeshStandardMaterial({ color: 0xa89888, roughness: 0.6 }),
  glass:    new THREE.MeshStandardMaterial({ color: 0x88bbdd, roughness: 0.1, transparent: true, opacity: 0.06, side: THREE.DoubleSide }),
  fraile:   new THREE.MeshStandardMaterial({ color: 0xd4a040, roughness: 0.4, side: THREE.DoubleSide }),
  tejRoof:  new THREE.MeshStandardMaterial({ color: 0x705838, roughness: 0.7, side: THREE.DoubleSide }),
  tejWall:  new THREE.MeshStandardMaterial({ color: 0x807060, roughness: 0.6 }),
  chapa:    new THREE.MeshStandardMaterial({ color: 0xccaa00, emissive: 0x554400, roughness: 0.3, metalness: 0.6 }),
  net:      new THREE.MeshStandardMaterial({ color: 0x9060b0, transparent: true, opacity: 0.35, side: THREE.DoubleSide }),
  line:     new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444, transparent: true, opacity: 0.5 }),
  padding:  new THREE.MeshStandardMaterial({ color: 0x332222, roughness: 0.95 }),
  oreille:  new THREE.MeshStandardMaterial({ color: 0x882828, emissive: 0x441111, roughness: 0.7 }),
};

function box(w, h, d, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function addEdge(pts, color = 0x446688, opacity = 0.3) {
  const g = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(...p)));
  scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity })));
}

// ── Floor ──
const floor = box(COURT_L, 0.12, COURT_W, mat.floor);
floor.position.set(COURT_L/2, -0.06, COURT_W/2);
scene.add(floor);

[10, 15, 17.5, 20].forEach(d => {
  const l = box(0.08, 0.005, COURT_W, mat.line);
  l.position.set(d, 0.005, COURT_W/2);
  scene.add(l);
});
const perpLine = box(COURT_L - 15, 0.005, 0.08, mat.line);
perpLine.position.set(15 + (COURT_L - 15)/2, 0.005, COURT_W/2);
scene.add(perpLine);

// ── Frontis (x=0) ──
const frontis = box(0.35, FRONTIS_H, COURT_W, mat.frontis);
frontis.position.set(-0.175, FRONTIS_H/2, COURT_W/2);
scene.add(frontis);

// Padding above chapa superior (dark non-play area)
const padAbove = box(0.36, FRONTIS_H - CHAPA_HIGH, COURT_W, mat.padding);
padAbove.position.set(-0.175, CHAPA_HIGH + (FRONTIS_H - CHAPA_HIGH)/2, COURT_W/2);
scene.add(padAbove);

// Oreilles — side wall fault zones (above 5.5m, first 4.5m from frontis)
const oreilleH = WALL_H_FRONT - WALL_H_BACK;

const chapaLow = box(0.06, 0.12, COURT_W + 0.1, mat.chapa);
chapaLow.position.set(0.03, CHAPA_LOW, COURT_W/2);
scene.add(chapaLow);

const chapaHigh = box(0.06, 0.1, COURT_W + 0.1, mat.chapa);
chapaHigh.position.set(0.03, CHAPA_HIGH, COURT_W/2);
scene.add(chapaHigh);

const padBelow = box(0.36, CHAPA_LOW, COURT_W, mat.padding);
padBelow.position.set(-0.175, CHAPA_LOW/2, COURT_W/2);
scene.add(padBelow);

// ── Frontis zones (educational target quadrants) ──
const ZONE_Y_MID = (CHAPA_LOW + CHAPA_HIGH) / 2;
const ZONE_Z_MID = COURT_W / 2;
const ZONE_H = (CHAPA_HIGH - CHAPA_LOW) / 2;
const ZONE_W_HALF = COURT_W / 2;

const zonesDef = [
  { id: 1, label: '1', yC: ZONE_Y_MID + ZONE_H/2, zC: ZONE_Z_MID + ZONE_W_HALF/2 },
  { id: 2, label: '2', yC: ZONE_Y_MID + ZONE_H/2, zC: ZONE_Z_MID - ZONE_W_HALF/2 },
  { id: 3, label: '3', yC: ZONE_Y_MID - ZONE_H/2, zC: ZONE_Z_MID + ZONE_W_HALF/2 },
  { id: 4, label: '4', yC: ZONE_Y_MID - ZONE_H/2, zC: ZONE_Z_MID - ZONE_W_HALF/2 },
];

const zones = [];
const hitZones = new Set();
const zoneBorderMat = new THREE.LineBasicMaterial({ color: 0x4488cc, transparent: true, opacity: 0.25 });

for (const zd of zonesDef) {
  const zm = new THREE.MeshStandardMaterial({
    color: 0x4488cc, transparent: true, opacity: 0.06,
    emissive: 0x000000, roughness: 0.5, side: THREE.DoubleSide,
  });
  const zh = ZONE_H - 0.1, zw = ZONE_W_HALF - 0.1;
  const mesh = box(0.02, zh, zw, zm);
  mesh.position.set(0.02, zd.yC, zd.zC);
  scene.add(mesh);

  const by0 = zd.yC - zh/2, by1 = zd.yC + zh/2;
  const bz0 = zd.zC - zw/2, bz1 = zd.zC + zw/2;
  const bx = 0.03;
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(bx,by0,bz0), new THREE.Vector3(bx,by1,bz0),
    new THREE.Vector3(bx,by1,bz1), new THREE.Vector3(bx,by0,bz1),
    new THREE.Vector3(bx,by0,bz0),
  ]), zoneBorderMat));

  const sp = createSprite(zd.label, [0.05, zd.yC, zd.zC], '#4488cc', 1.8);
  scene.add(sp);

  zones.push({ ...zd, mesh, mat: zm, sprite: sp });
}

function checkZoneHit(pos) {
  if (pos.x > 0.5) return;
  for (const z of zones) {
    if (hitZones.has(z.id)) continue;
    if (Math.abs(pos.y - z.yC) < ZONE_H/2 && Math.abs(pos.z - z.zC) < ZONE_W_HALF/2) {
      hitZones.add(z.id);
      z.mat.opacity = 0.3;
      z.mat.emissive.set(0x2266aa);
      z.sprite.material.opacity = 1.0;
    }
  }
}

function resetZones() {
  hitZones.clear();
  for (const z of zones) {
    z.mat.opacity = 0.06;
    z.mat.emissive.set(0x000000);
    z.sprite.material.opacity = 0.7;
  }
}

// ── Rebote (x=28.5) ──
const rebote = box(0.3, WALL_H_BACK, COURT_W, mat.rebote);
rebote.position.set(COURT_L + 0.15, WALL_H_BACK/2, COURT_W/2);
scene.add(rebote);

const chapaReb = box(0.06, 0.1, COURT_W + 0.1, mat.chapa);

function createSprite(text, pos, color = '#ffffff', size = 0.6) {
  const canvas = document.createElement('canvas');
  const c = canvas.getContext('2d');
  canvas.width = 512; canvas.height = 128;
  c.fillStyle = color;
  c.font = 'bold 36px system-ui, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.7, depthTest: false }));
  sp.position.set(...pos);
  sp.scale.set(size * 4, size, 1);
  return sp;
}

// ── Physics simulation ──
const GRAVITY = 9.81;
const RESTITUTION = 0.65;
const WALL_FRIC = 0.98;
const FLOOR_REST = 0.50;
const FLOOR_FRIC = 0.93;
const SIM_DT = 0.002;
const MAX_SIM_TIME = 8;
const MIN_SPEED = 0.4;
const RECORD_EVERY = 10;
const NET_Y_MIN = 0.95;
const NET_Y_MAX = 1.80;
const BALL_R = 0.12;

const ROOF_DZ = COURT_W - TEJ_Z;
const ROOF_DY = TEJ_H_INNER - TEJ_H_OUTER;
const ROOF_N_LEN = Math.sqrt(ROOF_DY * ROOF_DY + ROOF_DZ * ROOF_DZ);
const ROOF_NORMAL = new THREE.Vector3(0, ROOF_DZ / ROOF_N_LEN, -ROOF_DY / ROOF_N_LEN);

function roofY(z) {
  return TEJ_H_OUTER + (z - TEJ_Z) / ROOF_DZ * ROOF_DY;
}

function simulateShot(shot) {
  const d = new THREE.Vector3(...shot.dir).normalize();
  let vx = d.x * shot.strength, vy = d.y * shot.strength, vz = d.z * shot.strength;
  let x = shot.pos[0], y = shot.pos[1], z = shot.pos[2];

  const points = [new THREE.Vector3(x, y, z)];
  const breaks = [0];
  let netHit = null;
  let step = 0;
  const maxSteps = Math.ceil(MAX_SIM_TIME / SIM_DT);

  for (let i = 0; i < maxSteps; i++) {
    const prevX = x, prevY = y, prevZ = z;
    vy -= GRAVITY * SIM_DT;
    x += vx * SIM_DT;
    y += vy * SIM_DT;
    z += vz * SIM_DT;
    step++;

    let hit = false;

    // Main sare net (z = TEJ_Z), in the net window only: touching it ends the point
    const dzMain = z - prevZ;
    if (Math.abs(dzMain) > 1e-8) {
      const mainPlane = TEJ_Z;
      const crossedMain = (prevZ - (mainPlane - BALL_R)) * (z - (mainPlane - BALL_R)) <= 0
        || (prevZ - (mainPlane + BALL_R)) * (z - (mainPlane + BALL_R)) <= 0;
      if (crossedMain) {
        const t = Math.max(0, Math.min(1, (mainPlane - prevZ) / dzMain));
        const cx = prevX + (x - prevX) * t;
        const cy = prevY + (y - prevY) * t;
        if (cx >= NET_START && cx <= NET_END && cy >= NET_Y_MIN && cy <= NET_Y_MAX) {
          x = cx; y = cy; z = mainPlane;
          points.push(new THREE.Vector3(x, y, z));
          breaks.push(points.length);
          netHit = { net: 'main', index: points.length - 1 };
          break;
        }
      }
    }

    // Rebote sare net (x = rebTejX), in the middle 6m window: touching it ends the point
    const dxReb = x - prevX;
    if (Math.abs(dxReb) > 1e-8) {
      const rebPlane = rebTejX;
      const crossedReb = (prevX - (rebPlane - BALL_R)) * (x - (rebPlane - BALL_R)) <= 0
        || (prevX - (rebPlane + BALL_R)) * (x - (rebPlane + BALL_R)) <= 0;
      if (crossedReb) {
        const t = Math.max(0, Math.min(1, (rebPlane - prevX) / dxReb));
        const cy = prevY + (y - prevY) * t;
        const cz = prevZ + (z - prevZ) * t;
        if (cz >= rebNetStart && cz <= rebNetEnd && cy >= NET_Y_MIN && cy <= NET_Y_MAX) {
          x = rebPlane; y = cy; z = cz;
          points.push(new THREE.Vector3(x, y, z));
          breaks.push(points.length);
          netHit = { net: 'rebote', index: points.length - 1 };
          break;
        }
      }
    }

    // Fraile (45-degree wedge at frontis/glass corner, x+z = FRAILE_W)
    if (x >= 0 && x < FRAILE_W && z >= 0 && z < FRAILE_W && x + z < FRAILE_W && y < WALL_H_FRONT) {
      const pen = FRAILE_W - (x + z);
      x += pen / 2; z += pen / 2;
      const tvx = vx, tvz = vz;
      vx = -tvz * RESTITUTION;
      vz = -tvx * RESTITUTION;
      vy *= RESTITUTION;
      hit = true;
    }

    // Frontis (x = 0)
    if (x < 0) {
      x = -x;
      vx = Math.abs(vx) * RESTITUTION;
      vy *= WALL_FRIC; vz *= WALL_FRIC;
      hit = true;
    }

    // Rebote (x = COURT_L)
    if (x > COURT_L) {
      x = 2 * COURT_L - x;
      vx = -Math.abs(vx) * RESTITUTION;
      vy *= WALL_FRIC; vz *= WALL_FRIC;
      hit = true;
    }

    // Glass wall (z = 0)
    if (z < 0) {
      z = -z;
      vz = Math.abs(vz) * RESTITUTION;
      vx *= WALL_FRIC; vy *= WALL_FRIC;
      hit = true;
    }

    // Left side: tejadillo outer wall, roof, and wall above
    if (z > TEJ_Z) {
      if (y < TEJ_H_OUTER) {
        z = 2 * TEJ_Z - z;
        vz = -Math.abs(vz) * RESTITUTION;
        vx *= WALL_FRIC; vy *= WALL_FRIC;
        hit = true;
      } else if (z > COURT_W) {
        z = 2 * COURT_W - z;
        vz = -Math.abs(vz) * RESTITUTION;
        vx *= WALL_FRIC; vy *= WALL_FRIC;
        hit = true;
      } else {
        const ry = roofY(z);
        if (y < ry) {
          const dot = vx * ROOF_NORMAL.x + vy * ROOF_NORMAL.y + vz * ROOF_NORMAL.z;
          if (dot < 0) {
            vx = (vx - 2 * dot * ROOF_NORMAL.x) * RESTITUTION;
            vy = (vy - 2 * dot * ROOF_NORMAL.y) * RESTITUTION;
            vz = (vz - 2 * dot * ROOF_NORMAL.z) * RESTITUTION;
          }
          y = ry + 0.01;
          hit = true;
        }
      }
    }

    // Floor (y = 0)
    if (y < 0) {
      y = 0;
      vy = Math.abs(vy) * FLOOR_REST;
      vx *= FLOOR_FRIC; vz *= FLOOR_FRIC;
      hit = true;
    }

    // Record points
    if (hit) {
      points.push(new THREE.Vector3(x, y, z));
      breaks.push(points.length);
    } else if (step % RECORD_EVERY === 0) {
      points.push(new THREE.Vector3(x, y, z));
    }

    const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
    if (i > 200 && speed < MIN_SPEED && y < 0.15) break;
    if (points.length >= 1900) break;
  }

  if (breaks[breaks.length - 1] !== points.length)
    breaks.push(points.length);
  return { points, breaks, netHit };
}

const MAX_PTS = 2000;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(MAX_PTS * 3), 3));
trailGeo.setDrawRange(0, 0);
const trailMat = new THREE.LineBasicMaterial({ color: 0x4a7cff, linewidth: 2, transparent: true, opacity: 0.8 });
scene.add(new THREE.Line(trailGeo, trailMat));

const dashGeo = new THREE.BufferGeometry();
dashGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(MAX_PTS * 3), 3));
dashGeo.setDrawRange(0, 0);
const dashMat = new THREE.LineDashedMaterial({ color: 0x4a7cff, linewidth: 1, transparent: true, opacity: 0.45, dashSize: 0.3, gapSize: 0.15 });
const dashLine = new THREE.Line(dashGeo, dashMat);
scene.add(dashLine);

const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.12, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444, roughness: 0.3 })
);
ball.castShadow = true;
scene.add(ball);

const glow = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x4a7cff, transparent: true, opacity: 0.15 })
);
scene.add(glow);

const impactRings = [];
const ringGeo = new THREE.RingGeometry(0.15, 0.3, 24);
for (let i = 0; i < 6; i++) {
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
  ring.visible = false;
  scene.add(ring);
  impactRings.push(ring);
}

const playerBody = new THREE.Mesh(
  new THREE.CylinderGeometry(0.2, 0.25, 1.7, 12),
  new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })
);
scene.add(playerBody);
const playerHead = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 12, 12),
  new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })
);
scene.add(playerHead);

// ── Animation ──
let currentShot = 'saque';
let trajectory = simulateShot(shotDefs.saque);
let animProgress = 0;
let animSpeed = 1;
let paused = false;
let animating = true;
let liveApplyTimer = null;

function selectShot(key) {
  currentShot = key;
  const shot = shotDefs[key];
  trajectory = simulateShot(shot);
  trailMat.color.set(shot.color);
  dashMat.color.set(shot.color);
  glow.material.color.set(shot.color);

  document.querySelectorAll('.shot-btn').forEach(b => b.classList.remove('active'));
  const active = document.querySelector(`.shot-btn[data-shot="${key}"]`);
  if (active) active.classList.add('active');

  const pp = [shot.pos[0], 0, shot.pos[2]];
  playerBody.position.set(pp[0], 0.85, pp[2]);
  playerHead.position.set(pp[0], 1.88, pp[2]);
  syncEditorFromShot();
  replay();
}

function normNum(v, fallback = 0) {
  const n = Number.parseFloat(v);
  return Number.isFinite(n) ? n : fallback;
}

function syncEditorFromShot() {
  const s = shotDefs[currentShot];
  if (!s) return;
  document.getElementById('ed_pos_x').value = s.pos[0];
  document.getElementById('ed_pos_y').value = s.pos[1];
  document.getElementById('ed_pos_z').value = s.pos[2];
  document.getElementById('ed_dir_x').value = s.dir[0];
  document.getElementById('ed_dir_y').value = s.dir[1];
  document.getElementById('ed_dir_z').value = s.dir[2];
  document.getElementById('ed_strength').value = s.strength;
}

function pullEditorValuesIntoShot() {
  const s = shotDefs[currentShot];
  if (!s) return null;
  s.pos = [
    normNum(document.getElementById('ed_pos_x').value, s.pos[0]),
    normNum(document.getElementById('ed_pos_y').value, s.pos[1]),
    normNum(document.getElementById('ed_pos_z').value, s.pos[2]),
  ];
  s.dir = [
    normNum(document.getElementById('ed_dir_x').value, s.dir[0]),
    normNum(document.getElementById('ed_dir_y').value, s.dir[1]),
    normNum(document.getElementById('ed_dir_z').value, s.dir[2]),
  ];
  s.strength = Math.max(0.1, normNum(document.getElementById('ed_strength').value, s.strength));
  const pp = [s.pos[0], 0, s.pos[2]];
  playerBody.position.set(pp[0], 0.85, pp[2]);
  playerHead.position.set(pp[0], 1.88, pp[2]);
  return s;
}

function applyEditorToCurrentShot(replayAnim = true) {
  const s = pullEditorValuesIntoShot();
  if (!s) return;
  trajectory = simulateShot(s);
  if (replayAnim) replay();
}

function scheduleLiveApply() {
  if (!document.getElementById('ed_live').checked) return;
  if (liveApplyTimer) clearTimeout(liveApplyTimer);
  liveApplyTimer = setTimeout(() => {
    applyEditorToCurrentShot(true);
    liveApplyTimer = null;
  }, 80);
}

function exportShotDefsJson() {
  const payload = {
    version: 1,
    savedAt: new Date().toISOString(),
    shots: Object.fromEntries(shotKeys.map(k => [k, {
      pos: shotDefs[k].pos,
      dir: shotDefs[k].dir,
      strength: shotDefs[k].strength,
    }])),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trinquet-shots.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importShotDefsJson(text) {
  const parsed = JSON.parse(text);
  const source = parsed.shots || parsed;
  for (const key of shotKeys) {
    if (!source[key]) continue;
    const src = source[key];
    if (Array.isArray(src.pos) && src.pos.length === 3) shotDefs[key].pos = src.pos.map(v => normNum(v, 0));
    if (Array.isArray(src.dir) && src.dir.length === 3) shotDefs[key].dir = src.dir.map(v => normNum(v, 0));
    if (Number.isFinite(Number(src.strength))) shotDefs[key].strength = Math.max(0.1, Number(src.strength));
  }
  selectShot(currentShot);
}

function replay() {
  animProgress = 0;
  animating = true;
  paused = false;
  const pauseBtn = document.getElementById('pause');
  pauseBtn.textContent = t('pause');
  impactRings.forEach(r => r.visible = false);
  resetZones();
  resetNetHighlights();
}

function updateTrajectory(dt) {
  if (!animating || paused) return;
  const total = trajectory.points.length;
  const speed = (total / 2.5) * animSpeed;
  animProgress = Math.min(animProgress + dt * speed, total - 1);

  const idx = Math.floor(animProgress);
  const frac = animProgress - idx;
  const p0 = trajectory.points[Math.min(idx, total - 1)];
  const p1 = trajectory.points[Math.min(idx + 1, total - 1)];
  ball.position.lerpVectors(p0, p1, frac);
  glow.position.copy(ball.position);
  checkZoneHit(ball.position);
  if (trajectory.netHit && idx >= trajectory.netHit.index) {
    setNetHighlight(trajectory.netHit.net, true);
  }

  const firstBreak = trajectory.breaks[1] || total;
  const solidEnd = Math.min(idx + 1, firstBreak);
  const posAttr = trailGeo.getAttribute('position');
  for (let i = 0; i < solidEnd && i < MAX_PTS; i++) {
    const pt = trajectory.points[i];
    posAttr.setXYZ(i, pt.x, pt.y, pt.z);
  }
  posAttr.needsUpdate = true;
  trailGeo.setDrawRange(0, solidEnd);

  if (idx >= firstBreak) {
    const dashEnd = Math.min(idx + 1, total);
    const dashAttr = dashGeo.getAttribute('position');
    let di = 0;
    for (let i = firstBreak; i < dashEnd && di < MAX_PTS; i++, di++) {
      const pt = trajectory.points[i];
      dashAttr.setXYZ(di, pt.x, pt.y, pt.z);
    }
    dashAttr.needsUpdate = true;
    dashGeo.setDrawRange(0, di);
    dashLine.computeLineDistances();
  } else {
    dashGeo.setDrawRange(0, 0);
  }

  const breaks = trajectory.breaks;
  for (let i = 1; i < breaks.length - 1 && i - 1 < impactRings.length; i++) {
    const bIdx = breaks[i] - 1;
    if (idx >= bIdx) {
      const ring = impactRings[i - 1];
      ring.visible = true;
      const pt = trajectory.points[bIdx];
      ring.position.set(pt.x, pt.y, pt.z);
      if (pt.x < 0.5) ring.rotation.set(0, Math.PI/2, 0);
      else if (pt.z > W - 0.5) ring.rotation.set(0, 0, 0);
      else if (pt.z < 0.5) ring.rotation.set(0, 0, 0);
      else if (pt.y < 0.1) ring.rotation.set(Math.PI/2, 0, 0);
      else ring.lookAt(ball.position);
      const age = (animProgress - bIdx) / total;
      ring.material.opacity = Math.max(0, 0.6 - age * 3);
      const s = 1 + age * 4;
      ring.scale.set(s, s, s);
    }
  }
  if (animProgress >= total - 1) animating = false;
}

// ── Camera presets ──
const cameraPresets = {
  default: { pos: [30, 13, 0],      target: [10, 2, 5] },
  top:     { pos: [14, 32, 4.65],    target: [14, 0, 4.65] },
  side:    { pos: [14, 5, -10],      target: [14, 3, 4.65] },
  player:  { pos: [24, 2, W - 2.3],  target: [5, 2, W - 5] },
  frontis: { pos: [-6, 4, 4.65],     target: [14, 2, 4.65] },
  gallery: { pos: [14, 1.5, W + 3],  target: [14, 2, 4] },
};

let camTarget = null;
let camTween = 0;

document.querySelectorAll('#cameras button[data-cam]').forEach(btn => {
  btn.addEventListener('click', () => {
    const preset = cameraPresets[btn.dataset.cam];
    if (!preset) return;
    camTarget = {
      pos: new THREE.Vector3(...preset.pos),
      target: new THREE.Vector3(...preset.target),
      startPos: camera.position.clone(),
      startTarget: controls.target.clone(),
    };
    camTween = 0;
    document.querySelectorAll('#cameras button[data-cam]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

function updateCamera(dt) {
  if (!camTarget) return;
  camTween = Math.min(camTween + dt * 1.8, 1);
  const ct = 1 - Math.pow(1 - camTween, 3);
  camera.position.lerpVectors(camTarget.startPos, camTarget.pos, ct);
  controls.target.lerpVectors(camTarget.startTarget, camTarget.target, ct);
  if (camTween >= 1) camTarget = null;
}

// ── Controls ──
document.getElementById('replay').addEventListener('click', replay);

document.getElementById('speed').addEventListener('click', () => {
  const speeds = [0.25, 0.5, 1, 2];
  const idx = speeds.indexOf(animSpeed);
  animSpeed = speeds[(idx + 1) % speeds.length];
  document.getElementById('speed').textContent = `${t('speedLabel')}: ${animSpeed}x`;
});

document.getElementById('pause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('pause').textContent = paused ? t('resume') : t('pause');
});

document.getElementById('dimBtn').addEventListener('click', () => {
  dimGroup.visible = !dimGroup.visible;
  document.getElementById('dimBtn').classList.toggle('active', dimGroup.visible);
});

document.getElementById('editToggle').addEventListener('click', () => {
  const ed = document.getElementById('editor');
  const show = !ed.classList.contains('visible');
  ed.classList.toggle('visible', show);
  document.getElementById('editToggle').classList.toggle('active', show);
  if (show) syncEditorFromShot();
});

document.getElementById('ed_apply').addEventListener('click', applyEditorToCurrentShot);
document.getElementById('ed_export').addEventListener('click', exportShotDefsJson);
document.getElementById('ed_import_btn').addEventListener('click', () => {
  document.getElementById('ed_import_file').click();
});
document.getElementById('ed_import_file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      importShotDefsJson(String(reader.result || ''));
    } catch (err) {
      alert(`Invalid JSON: ${err.message}`);
    }
  };
  reader.readAsText(f);
  e.target.value = '';
});

[
  'ed_pos_x', 'ed_pos_y', 'ed_pos_z',
  'ed_dir_x', 'ed_dir_y', 'ed_dir_z',
  'ed_strength',
].forEach((id) => {
  document.getElementById(id).addEventListener('input', () => {
    // Keep shooter in sync immediately while editing coordinates.
    pullEditorValuesIntoShot();
    scheduleLiveApply();
  });
});

// ── Language toggle ──
function setLanguage(newLang) {
  lang = newLang;
  document.title = t('pageTitle');
  document.getElementById('langBtn').textContent = lang === 'en' ? 'FR' : 'EN';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (key === 'replay') el.innerHTML = t(key);
    else el.textContent = t(key);
  });

  document.getElementById('speed').textContent = `${t('speedLabel')}: ${animSpeed}x`;
  document.getElementById('pause').textContent = paused ? t('resume') : t('pause');

  createCourtLabels();
  buildShotPanel();
  updateLegend();
}

document.getElementById('langBtn').addEventListener('click', () => {
  setLanguage(lang === 'en' ? 'fr' : 'en');
});

// ── Render loop ──
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateCamera(dt);
  updateTrajectory(dt);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Init ──
buildShotPanel();
updateLegend();
selectShot('saque');
animate();

</script>
